{% extends "base.html" %}

{% block content %}
<div class="max-w-sm mx-auto mt-16">
    <h2 class="text-xl font-bold text-gray-800 mb-6 text-center">Sign in</h2>
    {% if error %}
    <p class="text-red-600 text-sm mb-4 text-center">{{ error }}</p>
    {% endif %}
    <form method="post" action="/login" class="space-y-4">
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" id="email" name="email" required autofocus
                   class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" id="password" name="password" required
                   class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button type="submit"
                class="w-full bg-blue-600 text-white py-2 px-4 rounded text-sm font-medium hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
            Sign in
        </button>
    </form>
</div>
{% endblock %}
