{% extends "base.html" %}

{% block content %}
<div class="mb-4">
    <a href="/statements" class="text-gray-500 hover:text-gray-700 text-sm">&larr; Back to Statements</a>
</div>

<form id="statement-form" method="post" action="/statements/{{ statement.id }}">
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-6">
        <div class="flex items-center gap-4 mb-6">
            <label for="statement_date" class="text-sm font-medium text-gray-600">Date</label>
            <input type="date" name="statement_date" id="statement_date"
                   value="{{ statement.statement_date }}"
                   class="rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border px-3 py-2"
                   onchange="markDirty()">
        </div>

        <!-- Assets Section -->
        <div class="mb-6">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-md font-semibold text-gray-700">Assets</h3>
                <button type="button" onclick="addAccount('asset')"
                        class="bg-green-600 hover:bg-green-700 text-white font-medium py-1 px-3 rounded-md transition-colors text-xs">
                    Add Asset
                </button>
            </div>
            <table class="w-full text-sm">
                <thead class="text-xs text-gray-500 uppercase border-b border-gray-200">
                    <tr>
                        <th class="py-2 pr-4 text-left">Name</th>
                        <th class="py-2 pr-4 text-right">Value</th>
                        <th class="py-2 w-16"></th>
                    </tr>
                </thead>
                <tbody id="assets-body">
                    {% for acct in assets %}
                    <tr class="account-row border-b border-gray-100">
                        <td class="py-2 pr-4">
                            <input type="hidden" name="account_ids" value="{{ acct.id }}">
                            <input type="hidden" name="account_types" value="asset">
                            <input type="text" name="account_names" value="{{ acct.name }}"
                                   class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border px-2 py-1 text-sm"
                                   onchange="markDirty()">
                        </td>
                        <td class="py-2 pr-4">
                            <input type="number" name="account_values" value="{{ acct.value | abs }}"
                                   min="0" step="0.01"
                                   class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border px-2 py-1 text-sm text-right"
                                   oninput="recalculate(); markDirty()">
                        </td>
                        <td class="py-2 text-center">
                            <button type="button" onclick="removeAccount(this)"
                                    class="text-red-500 hover:text-red-700 text-xs font-medium">Remove</button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
                <tfoot>
                    <tr class="border-t border-gray-300">
                        <td class="py-2 pr-4 font-medium text-gray-700">Subtotal</td>
                        <td class="py-2 pr-4 text-right font-medium text-gray-700" id="assets-subtotal">$0.00</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <!-- Liabilities Section -->
        <div class="mb-6">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-md font-semibold text-gray-700">Liabilities</h3>
                <button type="button" onclick="addAccount('liability')"
                        class="bg-red-600 hover:bg-red-700 text-white font-medium py-1 px-3 rounded-md transition-colors text-xs">
                    Add Liability
                </button>
            </div>
            <table class="w-full text-sm">
                <thead class="text-xs text-gray-500 uppercase border-b border-gray-200">
                    <tr>
                        <th class="py-2 pr-4 text-left">Name</th>
                        <th class="py-2 pr-4 text-right">Value</th>
                        <th class="py-2 w-16"></th>
                    </tr>
                </thead>
                <tbody id="liabilities-body">
                    {% for acct in liabilities %}
                    <tr class="account-row border-b border-gray-100">
                        <td class="py-2 pr-4">
                            <input type="hidden" name="account_ids" value="{{ acct.id }}">
                            <input type="hidden" name="account_types" value="liability">
                            <input type="text" name="account_names" value="{{ acct.name }}"
                                   class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border px-2 py-1 text-sm"
                                   onchange="markDirty()">
                        </td>
                        <td class="py-2 pr-4">
                            <input type="number" name="account_values" value="{{ acct.value | abs }}"
                                   min="0" step="0.01"
                                   class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border px-2 py-1 text-sm text-right"
                                   oninput="recalculate(); markDirty()">
                        </td>
                        <td class="py-2 text-center">
                            <button type="button" onclick="removeAccount(this)"
                                    class="text-red-500 hover:text-red-700 text-xs font-medium">Remove</button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
                <tfoot>
                    <tr class="border-t border-gray-300">
                        <td class="py-2 pr-4 font-medium text-gray-700">Subtotal</td>
                        <td class="py-2 pr-4 text-right font-medium text-gray-700" id="liabilities-subtotal">$0.00</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <!-- Net Worth -->
        <div class="border-t-2 border-gray-400 pt-3 mb-6">
            <div class="flex justify-between items-center">
                <span class="text-lg font-bold text-gray-800">Net Worth</span>
                <span class="text-lg font-bold text-gray-800" id="net-worth">$0.00</span>
            </div>
        </div>

        <!-- Save -->
        <div class="flex items-center gap-3">
            <button type="submit" id="save-btn"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-md transition-colors text-sm">
                Save
            </button>
            <span id="save-feedback"></span>
        </div>
    </div>
</form>

<script>
    let dirty = false;

    function markDirty() {
        dirty = true;
        const btn = document.getElementById('save-btn');
        btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
        btn.classList.add('bg-orange-500', 'hover:bg-orange-600');
        document.getElementById('save-feedback').textContent = 'Unsaved changes';
        document.getElementById('save-feedback').className = 'text-orange-500 text-sm';
    }

    function formatAccounting(val) {
        if (val < 0) {
            return '($' + Math.abs(val).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ')';
        }
        return '$' + val.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    function recalculate() {
        let assetsTotal = 0;
        let liabilitiesTotal = 0;

        document.querySelectorAll('#assets-body .account-row').forEach(function(row) {
            const val = parseFloat(row.querySelector('input[name="account_values"]').value) || 0;
            assetsTotal += val;
        });

        document.querySelectorAll('#liabilities-body .account-row').forEach(function(row) {
            const val = parseFloat(row.querySelector('input[name="account_values"]').value) || 0;
            liabilitiesTotal += val;
        });

        document.getElementById('assets-subtotal').textContent = formatAccounting(assetsTotal);
        document.getElementById('liabilities-subtotal').textContent = formatAccounting(-liabilitiesTotal);
        document.getElementById('net-worth').textContent = formatAccounting(assetsTotal - liabilitiesTotal);
    }

    function addAccount(type) {
        const tbody = type === 'asset'
            ? document.getElementById('assets-body')
            : document.getElementById('liabilities-body');

        const tr = document.createElement('tr');
        tr.className = 'account-row border-b border-gray-100';
        tr.innerHTML = `
            <td class="py-2 pr-4">
                <input type="hidden" name="account_ids" value="">
                <input type="hidden" name="account_types" value="${type}">
                <input type="text" name="account_names" value=""
                       placeholder="Account name"
                       class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border px-2 py-1 text-sm"
                       onchange="markDirty()">
            </td>
            <td class="py-2 pr-4">
                <input type="number" name="account_values" value="0"
                       min="0" step="0.01"
                       class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border px-2 py-1 text-sm text-right"
                       oninput="recalculate(); markDirty()">
            </td>
            <td class="py-2 text-center">
                <button type="button" onclick="removeAccount(this)"
                        class="text-red-500 hover:text-red-700 text-xs font-medium">Remove</button>
            </td>
        `;
        tbody.appendChild(tr);
        markDirty();
        recalculate();
    }

    function removeAccount(btn) {
        btn.closest('tr').remove();
        markDirty();
        recalculate();
    }

    // Initial calculation
    recalculate();

    // Form submission via fetch for inline feedback
    document.getElementById('statement-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const form = e.target;
        const formData = new FormData(form);

        fetch(form.action, {
            method: 'POST',
            body: formData,
        })
        .then(function(response) { return response.text().then(function(text) { return {ok: response.ok, status: response.status, text: text}; }); })
        .then(function(result) {
            const feedback = document.getElementById('save-feedback');
            if (result.ok) {
                dirty = false;
                const btn = document.getElementById('save-btn');
                btn.classList.remove('bg-orange-500', 'hover:bg-orange-600');
                btn.classList.add('bg-blue-600', 'hover:bg-blue-700');
                feedback.textContent = 'Saved';
                feedback.className = 'text-green-600 text-sm';
                // Reload to get updated account IDs
                window.location.reload();
            } else {
                feedback.innerHTML = result.text;
                feedback.className = 'text-red-600 text-sm';
            }
        });
    });
</script>
{% endblock %}
